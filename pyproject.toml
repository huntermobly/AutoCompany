[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "india-company-compliance-backend"
version = "0.1.0"
description = "Backend-only, evidence-based Indian company compliance preparation API"
requires-python = ">=3.12"
dependencies = ["starlette==1.3.1", "pydantic==2.13.4", "uvicorn==0.49.0", "httpx==0.28.1", "matplotlib==3.9.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4", "PyPDF2==3.0.1"]

[tool.setuptools.packages.find]
include = ["compliance*"]

[tool.setuptools.package-data]
compliance = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in external requests requiring user-provided credentials"]
addopts = "-ra"

[tool.coverage.run]
source = ["compliance"]
omit = ["compliance/__main__.py"]

[tool.coverage.report]
show_missing = true

